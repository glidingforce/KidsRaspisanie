<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body><title>לו״ז ילדים אילן ולי ים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one sheet. Status line, month pager, 7-column month grid colored by parent, holiday list for the month. */
:root{
  --bg:#f3f5f4; --sheet:#ffffff; --fg:#17211d; --muted:#5f6c67; --line:#dde3e0;
  --ilan:#1f9d57; --ilan-soft:#dff3e7; --ilan-ink:#0d5a30;
  --liyam:#2b6fd6; --liyam-soft:#e0ebfb; --liyam-ink:#143f85;
  --past-bg:#eceeed; --past-ink:#99a29e; --past-line:#cdd3d0;
  --hol:#d97706; --hol-soft:#fdf0d9; --hol-ink:#7a4204;
  --font:"Rubik","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --sheet:#1a211f; --fg:#eef3f1; --muted:#9aa8a3; --line:#2c3633;
    --ilan:#37c277; --ilan-soft:#173b29; --ilan-ink:#bff0d3;
    --liyam:#5a97f0; --liyam-soft:#182f52; --liyam-ink:#cfe0fb;
    --past-bg:#202625; --past-ink:#66716d; --past-line:#343d3a;
    --hol:#f5a524; --hol-soft:#3a2a0c; --hol-ink:#fbd795;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --sheet:#1a211f; --fg:#eef3f1; --muted:#9aa8a3; --line:#2c3633;
  --ilan:#37c277; --ilan-soft:#173b29; --ilan-ink:#bff0d3;
  --liyam:#5a97f0; --liyam-soft:#182f52; --liyam-ink:#cfe0fb;
  --past-bg:#202625; --past-ink:#66716d; --past-line:#343d3a;
  --hol:#f5a524; --hol-soft:#3a2a0c; --hol-ink:#fbd795;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:24px;}
.sheet{max-width:720px;margin-inline:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
h1{margin:0;font-size:1.5rem;font-weight:700;}
h2{margin:0;font-size:1.2rem;font-weight:700;text-align:center;flex:1;min-width:0;}
h3{margin:0;font-size:1rem;font-weight:700;}
button{font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;}
button:hover:not(:disabled){border-color:var(--muted);}
button:focus-visible{outline:3px solid var(--liyam);outline-offset:2px;}
button:disabled{opacity:.35;cursor:default;}
.lang{display:flex;gap:6px;}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--sheet);border-color:var(--fg);}
.status{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem;}
.status b{font-weight:700;}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:700;white-space:nowrap;}
.chip.i{background:var(--ilan-soft);color:var(--ilan-ink);} .chip.l{background:var(--liyam-soft);color:var(--liyam-ink);}
.pager{display:flex;align-items:center;gap:8px;}
.pager .arrow{font-size:1.2rem;padding:6px 16px;line-height:1.2;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-weight:500;font-size:.9rem;}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;}
.dot.i{background:var(--ilan);} .dot.l{background:var(--liyam);} .dot.p{background:var(--past-line);} .dot.h{background:var(--hol);border-radius:50%;width:10px;height:10px;}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.dayname{text-align:center;font-size:.8rem;font-weight:500;color:var(--muted);padding-bottom:2px;}
.cell{position:relative;min-width:0;min-height:62px;border-radius:9px;padding:7px 2px 9px;text-align:center;font-weight:700;font-size:.78rem;line-height:1.25;overflow-wrap:anywhere;border-top:5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px;}
.cell .d{font-weight:500;font-size:.85rem;font-variant-numeric:tabular-nums;min-width:1.7em;line-height:1.7em;border-radius:50%;}
.cell.i{background:var(--ilan-soft);color:var(--ilan-ink);border-color:var(--ilan);}
.cell.l{background:var(--liyam-soft);color:var(--liyam-ink);border-color:var(--liyam);}
.cell.past{background:var(--past-bg);color:var(--past-ink);border-color:var(--past-line);}
.cell.today{outline:3px solid var(--fg);outline-offset:1px;}
.cell.today .d{background:var(--fg);color:var(--sheet);font-weight:700;}
.cell .hd{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--hol);}
.cell.past .hd{opacity:.45;}
.hols{display:flex;flex-direction:column;gap:8px;}
.hol{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hol-soft);color:var(--hol-ink);border-radius:9px;padding:8px 12px;font-size:.92rem;}
.hol.past{background:var(--past-bg);color:var(--past-ink);}
.hol .when{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.2em;}
.hol .nm{flex:1;min-width:0;font-weight:500;}
.hol .who{display:flex;gap:3px;}
.hol .who i{width:13px;height:13px;border-radius:3px;display:block;}
.hol .who i.i{background:var(--ilan);} .hol .who i.l{background:var(--liyam);}
.hol.past .who i{background:var(--past-line);}
.note{margin:0;color:var(--muted);font-size:.85rem;}
@media (min-width:600px){.cell{font-size:1rem;min-height:78px;padding:9px 4px 12px;}.cell .d{font-size:.95rem;}.dayname{font-size:.95rem;}.sheet{padding:28px;}}
.cell{cursor:pointer;}
.cell:focus-visible{outline:3px solid var(--liyam);outline-offset:1px;}
.cell.sel{box-shadow:0 0 0 3px var(--hol);}
.cell .sw{position:absolute;top:3px;inset-inline-start:5px;font-size:.75rem;font-weight:700;line-height:1;}
.cell.today{animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{50%{outline-color:transparent;}}
@media (prefers-reduced-motion:reduce){.cell.today{animation:none;}}
.swappanel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:2px solid var(--hol);border-radius:10px;padding:10px 12px;font-size:.95rem;}
.swappanel .acts{display:flex;gap:8px;flex-wrap:wrap;}
.swrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:9px;padding:8px 12px;font-size:.92rem;}
.swrow .when{font-weight:700;font-variant-numeric:tabular-nums;min-width:5.6em;}
.swrow .nm{flex:1;min-width:0;}
[hidden]{display:none!important;}
</style>

<section class="sheet" id="sheet" dir="rtl" lang="he">
  <div class="top">
    <h1 id="h1">לו״ז הילדים</h1>
    <div class="lang">
      <button type="button" id="lang-he" aria-pressed="true">עברית</button>
      <button type="button" id="lang-ru" aria-pressed="false">Русский</button>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="pager">
    <button type="button" class="arrow" id="prev"></button>
    <h2 id="month"></h2>
    <button type="button" class="arrow" id="next"></button>
  </div>
  <div><button type="button" id="today"></button></div>
  <div class="grid" id="grid"></div>
  <div class="swappanel" id="swap" hidden></div>
  <div class="legend" id="legend"></div>
  <h3 id="hols-title"></h3>
  <div class="hols" id="hols"></div>
  <h3 id="swaps-title"></h3>
  <div class="hols" id="swaps"></div>
  <p class="note" id="swap-note"></p>
  <p class="note" id="note"></p>
</section>

<script>
/*CALC-START*/
function dn(y,m,d){return Math.floor(Date.UTC(y,m,d)/864e5);}          // day number since 1970-01-01
function dow(n){return (((n+4)%7)+7)%7;}                                 // 0 = Sunday
// Custody: week of Sun 4 Oct 2026 has Thursday with Ilan and the weekend with Li Yam; weeks alternate.
var ANCHOR=dn(2026,9,4), WA=['l','i','i','l','i','l','l'], WB=['l','i','i','l','l','i','i'];
function who(n){var k=n-ANCHOR,wk=Math.floor(k/7);return ((((wk%2)+2)%2)===0?WA:WB)[dow(n)];}
// Hebrew calendar arithmetic (molad based), calibrated on 1 Tishrei 5787 = 12 Sep 2026.
function leap(y){return (7*y+1)%19<7;}
function newYear(y){ // days to 1 Tishrei: molad plus the four postponement rules
  var m=Math.floor((235*y-234)/19),pe=204+793*(m%1080),he=5+12*m+793*Math.floor(m/1080)+Math.floor(pe/1080);
  var day=1+29*m+Math.floor(he/24),parts=1080*(he%24)+pe%1080,alt=day;
  if(parts>=19440||(day%7===2&&parts>=9924&&!leap(y))||(day%7===1&&parts>=16789&&leap(y-1)))alt++;
  if(alt%7===0||alt%7===3||alt%7===5)alt++;
  return alt;
}
var HOFF=dn(2026,8,12)-newYear(5787);
function rosh(y){return newYear(y)+HOFF;}
function holidays(y){
  var r=rosh(y),n=rosh(y+1),len=n-r,hesh=(len%10===5)?30:29,kis=(len%10===3)?29:30,p=n-163,out=[],i,w;
  function add(d,k){out.push([d,k]);}
  add(r-1,'erh');add(r,'rh');add(r+1,'rh');add(r+8,'eyk');add(r+9,'yk');add(r+13,'esuk');add(r+14,'suk');
  for(i=15;i<=20;i++)add(r+i,'chs');
  add(r+21,'st');
  for(i=0;i<8;i++)add(r+30+hesh+24+i,'han');
  add(r+30+hesh+kis+29+14,'tu');
  add(p-30,'pur');add(p-29,'spur');add(p-1,'epes');add(p,'pes');
  for(i=1;i<=5;i++)add(p+i,'chp');
  add(p+6,'pes7');
  var sh=p+12;w=dow(sh);if(w===5)sh--;else if(w===0)sh++;add(sh,'shoa');
  var at=p+20;w=dow(at);if(w===5)at-=1;else if(w===6)at-=2;else if(w===1)at+=1;add(at-1,'zik');add(at,'atz');
  add(p+33,'lag');add(p+49,'eshav');add(p+50,'shav');
  var tb=p+112;if(dow(tb)===6)tb++;add(tb,'tba');
  return out;
}
/*CALC-END*/

(function(){
  var T={
    he:{dir:'rtl',h1:'לו״ז הילדים',names:{i:'אילן',l:'לי ים'},at:{i:'אצל אילן',l:'אצל לי ים'},
      days:['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'],
      dayFull:['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת'],
      months:['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'],
      today:'היום',goToday:'חזרה להיום',kids:'הילדים',weekend:'הסופ״ש הקרוב',prev:'החודש הקודם',next:'החודש הבא',
      past:'ימים שעברו',swapped:'הוחלף',moveTo:'להעביר',to:{i:'לאילן',l:'ללי ים'},undo:'לבטל את ההחלפה',undoShort:'ביטול',close:'סגור',swapsTitle:'החלפות קרובות',noSwaps:'אין החלפות.',swapNote:'כדי להחליף יום, לוחצים עליו בלוח. ההחלפות נשמרות רק במכשיר הזה.',holiday:'חג',holsTitle:'חגים ומועדים החודש',noHols:'אין חגים בחודש הזה.',
      note:'קבוע בכל שבוע: ראשון ורביעי אצל לי ים, שני ושלישי אצל אילן. חמישי וסופ״ש מתחלפים. החגים מוצגים לידיעה בלבד: הלו״ז לא משתנה בגללם.',
      h:{erh:'ערב ראש השנה',rh:'ראש השנה',eyk:'ערב יום כיפור',yk:'יום כיפור',esuk:'ערב סוכות',suk:'סוכות',chs:'חול המועד סוכות',st:'שמחת תורה',han:'חנוכה',tu:'ט״ו בשבט',pur:'פורים',spur:'שושן פורים',epes:'ערב פסח',pes:'פסח',chp:'חול המועד פסח',pes7:'שביעי של פסח',shoa:'יום השואה',zik:'יום הזיכרון',atz:'יום העצמאות',lag:'ל״ג בעומר',eshav:'ערב שבועות',shav:'שבועות',tba:'תשעה באב'}},
    ru:{dir:'ltr',h1:'Расписание детей',names:{i:'Илан ❤️',l:'Ли Ям'},at:{i:'у Илана ❤️',l:'у Ли Ям'},
      days:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],
      dayFull:['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],
      months:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
      today:'Сегодня',goToday:'Вернуться к сегодня',kids:'дети',weekend:'Ближайшие выходные',prev:'Предыдущий месяц',next:'Следующий месяц',
      past:'Прошедшие дни',swapped:'Замена',moveTo:'Передать',to:{i:'Илану ❤️',l:'Ли Ям'},undo:'Отменить замену',undoShort:'Отменить',close:'Закрыть',swapsTitle:'Ближайшие замены',noSwaps:'Замен нет.',swapNote:'Чтобы поменять день, нажмите на него в календаре. Замены сохраняются только на этом устройстве.',holiday:'Праздник',holsTitle:'Праздники в этом месяце',noHols:'В этом месяце праздников нет.',
      note:'Каждую неделю: воскресенье и среда у Ли Ям, понедельник и вторник у Илана. Четверг и выходные чередуются. Праздники показаны для сведения: расписание из-за них не меняется.',
      h:{erh:'Канун Рош ха-Шана',rh:'Рош ха-Шана',eyk:'Канун Йом Кипур',yk:'Йом Кипур',esuk:'Канун Суккот',suk:'Суккот',chs:'Холь ха-моэд Суккот',st:'Симхат Тора',han:'Ханука',tu:'Ту би-Шват',pur:'Пурим',spur:'Шушан Пурим',epes:'Канун Песаха',pes:'Песах',chp:'Холь ха-моэд Песах',pes7:'Седьмой день Песаха',shoa:'Йом ха-Шоа',zik:'Йом ха-Зикарон',atz:'Йом ха-Ацмаут',lag:'Лаг ба-Омер',eshav:'Канун Шавуот',shav:'Шавуот',tba:'Тиша бе-Ав'}}
  };
  var MIN_Y=2026, MIN_M=9; // schedule is known from October 2026 onward
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  var lang=window.KIDS_DEFAULT_LANG||'he', swaps={}, sel=null;
  try{(JSON.parse(localStorage.getItem('kids-swaps'))||[]).forEach(function(x){swaps[x]=1;});}catch(e){}
  function save(){try{localStorage.setItem('kids-swaps',JSON.stringify(Object.keys(swaps).map(Number)));}catch(e){}}
  function W(n){var b=who(n);return swaps[n]?(b==='i'?'l':'i'):b;}
  function dmy(n){var d=new Date(n*864e5);return d.getUTCDate()+'.'+(d.getUTCMonth()+1)+'.'+String(d.getUTCFullYear()).slice(2);}
  try{var saved=localStorage.getItem('kids-lang');if(saved==='ru'||saved==='he')lang=saved;}catch(e){}
  if(location.hash==='#ru')lang='ru'; else if(location.hash==='#he')lang='he';

  function todayNum(){var n=new Date();return dn(n.getFullYear(),n.getMonth(),n.getDate());}
  var now=new Date(), vy=now.getFullYear(), vm=now.getMonth();
  if(vy<MIN_Y||(vy===MIN_Y&&vm<MIN_M)){vy=MIN_Y;vm=MIN_M;}

  var hcache={};
  function holMap(gy){ // key -> holiday for every day touching Gregorian year gy
    if(hcache[gy])return hcache[gy];
    var map={};
    [gy+3760,gy+3761].forEach(function(hy){holidays(hy).forEach(function(e){map[e[0]]=e[1];});});
    return hcache[gy]=map;
  }
  function dm(n){var d=new Date(n*864e5);return d.getUTCDate()+'.'+(d.getUTCMonth()+1);}

  function render(){
    var t=T[lang], sheet=$('sheet'), tn=todayNum();
    sheet.dir=t.dir; sheet.lang=lang;
    $('h1').textContent=t.h1;
    $('lang-he').setAttribute('aria-pressed',lang==='he'); $('lang-ru').setAttribute('aria-pressed',lang==='ru');
    $('prev').textContent=t.dir==='rtl'?'→':'←'; $('next').textContent=t.dir==='rtl'?'←':'→';
    $('prev').setAttribute('aria-label',t.prev); $('next').setAttribute('aria-label',t.next);
    $('prev').disabled=(vy===MIN_Y&&vm===MIN_M);
    $('today').textContent=t.goToday;
    $('month').textContent=t.months[vm]+' '+vy;

    // status: today + nearest weekend
    var w=W(tn), sat=tn+(6-dow(tn)), fri=sat-1, ww=W(sat);
    $('status').innerHTML=
      '<div><b>'+esc(t.today)+'</b>, '+esc(t.dayFull[dow(tn)])+' '+dm(tn)+': '+esc(t.kids)+' <span class="chip '+w+'">'+esc(t.at[w])+'</span></div>'+
      '<div><b>'+esc(t.weekend)+'</b> ('+dm(fri)+' - '+dm(sat)+'): <span class="chip '+ww+'">'+esc(t.at[ww])+'</span></div>';

    // grid
    var first=dn(vy,vm,1), last=dn(vy,vm+1,0), hm=holMap(vy), h='', n, i;
    t.days.forEach(function(d){h+='<div class="dayname">'+esc(d)+'</div>';});
    for(i=0;i<dow(first);i++)h+='<div></div>';
    for(n=first;n<=last;n++){
      var c=W(n), cls='cell '+c+(n<tn?' past':'')+(n===tn?' today':'')+(swaps[n]?' swapped':'')+(sel===n?' sel':'');
      h+='<div role="button" tabindex="0" data-n="'+n+'" class="'+cls+'"'+(hm[n]?' title="'+esc(t.h[hm[n]])+'"':'')+'>'+(hm[n]?'<span class="hd"></span>':'')+
         (swaps[n]?'<span class="sw">⇄</span>':'')+'<span class="d">'+(n-first+1)+'</span><span>'+esc(t.names[c])+'</span></div>';
    }
    $('grid').innerHTML=h;

    // swap panel for the selected day
    var p=$('swap');
    if(sel!==null&&sel>=first&&sel<=last){
      var cw=W(sel), ow=cw==='i'?'l':'i';
      p.hidden=false;
      p.innerHTML='<span>'+esc(t.dayFull[dow(sel)])+' '+dm(sel)+': <span class="chip '+cw+'">'+esc(t.at[cw])+'</span></span><span class="acts"><button type="button" id="do-swap">'+esc(swaps[sel]?t.undo:t.moveTo+' '+t.to[ow])+'</button><button type="button" id="no-swap">'+esc(t.close)+'</button></span>';
      $('do-swap').onclick=function(){if(swaps[sel])delete swaps[sel];else swaps[sel]=1;save();sel=null;render();};
      $('no-swap').onclick=function(){sel=null;render();};
    }else{p.hidden=true;p.innerHTML='';}
    var ks=Object.keys(swaps).map(Number).filter(function(x){return x>=tn;}).sort(function(a,b){return a-b;}), sh='';
    ks.forEach(function(x){var c2=W(x);sh+='<div class="swrow"><span class="when" dir="ltr">'+dmy(x)+'</span><span class="nm">'+esc(t.dayFull[dow(x)])+' <span class="chip '+c2+'">'+esc(t.at[c2])+'</span></span><button type="button" data-rm="'+x+'">'+esc(t.undoShort)+'</button></div>';});
    $('swaps-title').textContent=t.swapsTitle;
    $('swaps').innerHTML=sh||'<p class="note">'+esc(t.noSwaps)+'</p>';
    $('swap-note').textContent=t.swapNote;

    $('legend').innerHTML='<span><i class="dot i"></i>'+esc(t.names.i)+'</span><span><i class="dot l"></i>'+esc(t.names.l)+'</span>'+
      '<span><i class="dot p"></i>'+esc(t.past)+'</span><span><b>⇄</b>'+esc(t.swapped)+'</span><span><i class="dot h"></i>'+esc(t.holiday)+'</span>';

    // holiday list: merge consecutive days of the same holiday
    var runs=[], cur=null;
    for(n=first;n<=last;n++){
      var k=hm[n];
      if(k&&cur&&cur.k===k&&cur.b===n-1){cur.b=n;}
      else if(k){cur={k:k,a:n,b:n};runs.push(cur);}
    }
    h='';
    runs.forEach(function(r){
      var sq='';for(var x=r.a;x<=r.b;x++)sq+='<i class="'+W(x)+'"></i>';
      var when=r.a===r.b?dm(r.a):(dm(r.a)+' - '+dm(r.b));
      var whoTxt=r.a===r.b?'<span class="chip '+W(r.a)+'">'+esc(t.at[W(r.a)])+'</span>':'<span class="who">'+sq+'</span>';
      h+='<div class="hol'+(r.b<tn?' past':'')+'"><span class="when" dir="ltr">'+when+'</span><span class="nm">'+esc(t.h[r.k])+'</span>'+(r.b<tn?'<span class="who">'+sq+'</span>':whoTxt)+'</div>';
    });
    $('hols-title').textContent=t.holsTitle;
    $('hols').innerHTML=h||'<p class="note">'+esc(t.noHols)+'</p>';
    $('note').textContent=t.note;
  }

  function setLang(l){lang=l;try{localStorage.setItem('kids-lang',l);}catch(e){}render();}
  $('lang-he').addEventListener('click',function(){setLang('he');});
  $('lang-ru').addEventListener('click',function(){setLang('ru');});
  $('prev').addEventListener('click',function(){if(vy===MIN_Y&&vm===MIN_M)return;vm--;if(vm<0){vm=11;vy--;}render();});
  $('next').addEventListener('click',function(){vm++;if(vm>11){vm=0;vy++;}render();});
  $('today').addEventListener('click',function(){var d=new Date();vy=d.getFullYear();vm=d.getMonth();if(vy<MIN_Y||(vy===MIN_Y&&vm<MIN_M)){vy=MIN_Y;vm=MIN_M;}render();});
  function pick(e){var el=e.target.closest?e.target.closest('[data-n]'):null;if(!el)return;var n=+el.getAttribute('data-n');sel=(sel===n?null:n);render();}
  $('grid').addEventListener('click',pick);
  $('grid').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e);}});
  $('swaps').addEventListener('click',function(e){var x=e.target.getAttribute('data-rm');if(x){delete swaps[x];save();render();}});
  render();
})();
</script>
</body></html>
