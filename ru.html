}

.lang{display:flex;gap:6px;}

.status{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem;}
.status b{font-weight:700;}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:700;white-space:nowrap;}
.chip.i{background:var(--ilan-soft);color:var(--ilan-ink);} .chip.l{background:var(--liyam-soft);color:var(--liyam-ink);}
.pager{display:flex;align-items:center;gap:8px;}
.pager .arrow{font-size:1.2rem;padding:6px 16px;line-height:1.2;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-weight:500;font-size:.9rem;}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;}

.cell.l{background:var(--liyam-soft);color:var(--liyam-ink);border-color:var(--liyam);}
.cell.past{background:var(--past-bg);color:var(--past-ink);border-color:var(--past-line);}
.cell.today{outline:3px solid var(--fg);outline-offset:1px;}
.cell.today .d{background:var(--fg);color:var(--sheet);font-weight:700;}

.cell{cursor:pointer;}

.cell.sel{box-shadow:0 0 0 3px var(--hol);}

.swrow .when{font-weight:700;font-variant-numeric:tabular-nums;min-width:5.6em;}

.cell .ev{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;box-sizing:border-box;width:calc(100% - 4px);background:var(--ev);color:var(--ev-ink);border-radius:5px;padding:2px 3px;font-size:.68rem;font-weight:700;line-height:1.2;overflow:hidden;overflow-wrap:anywhere;}

.swappanel>*{min-width:0;max-width:100%;}
.cell.past .ev{opacity:.5;}
.dot.e{background:var(--ev);}
.swappanel{flex-direction:column;align-items:stretch;}
.swappanel .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
.swappanel .evadd{display:flex;gap:8px;}
.swappanel input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
.swappanel input:focus-visible{outline:3px solid var(--ev);outline-offset:1px;}
.evitem{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.evtag{background:var(--ev);color:var(--ev-ink);border-radius:7px;padding:4px 10px;font-weight:700;min-width:0;overflow-wrap:anywhere;}
.syncnote{font-size:.85rem;color:var(--muted);}
.syncnote.err{color:var(--hol-ink);background:var(--hol-soft);border-radius:8px;padding:6px 10px;}
</style>

  var hcache={};
  function holMap(gy){ // key -> holiday for every day touching Gregorian year gy
    if(hcache[gy])return hcache[gy];
    var map={};
    [gy+3760,gy+3761].forEach(function(hy){holidays(hy).forEach(function(e){map[e[0]]=e[1];});});
    return hcache[gy]=map;
  }
  function dm(n){var d=new Date(n*864e5);return d.getUTCDate()+'.'+(d.getUTCMonth()+1);}

  function render(){
    var t=T[lang], sheet=$('sheet'), tn=todayNum();
    sheet.dir=t.dir; sheet.lang=lang;
    $('h1').textContent=t.h1;
    $('lang-he').setAttribute('aria-pressed',lang==='he'); $('lang-ru').setAttribute('aria-pressed',lang==='ru');
    $('prev').textContent=t.dir==='rtl'?'→':'←'; $('next').textContent=t.dir==='rtl'?'←':'→';
    $('prev').setAttribute('aria-label',t.prev); $('next').setAttribute('aria-label',t.next);
    $('prev').disabled=(vy===MIN_Y&&vm===MIN_M);
    $('today').textContent=t.goToday;
    $('month').textContent=t.months[vm]+' '+vy;

    // status: today + nearest weekend
    var w=W(tn), sat=tn+(6-dow(tn)), fri=sat-1, ww=W(sat);
    $('status').innerHTML=
      '<div><b>'+esc(t.today)+'</b>, '+esc(t.dayFull[dow(tn)])+' '+dm(tn)+': '+esc(t.kids)+' <span class="chip '+w+'">'+esc(t.at[w])+'</span></div>'+
      '<div><b>'+esc(t.weekend)+'</b> ('+dm(fri)+' - '+dm(sat)+'): <span class="chip '+ww+'">'+esc(t.at[ww])+'</span></div>';

    // grid
    var first=dn(vy,vm,1), last=dn(vy,vm+1,0), hm=holMap(vy), h='', n, i;
    t.days.forEach(function(d){h+='<div class="dayname">'+esc(d)+'</div>';});
    for(i=0;i<dow(first);i++)h+='<div></div>';
    for(n=first;n<=last;n++){
      var c=W(n), cls='cell '+c+(n<tn?' past':'')+(n===tn?' today':'')+(swaps[n]?' swapped':'')+(sel===n?' sel':'');
      h+='<div role="button" tabindex="0" data-n="'+n+'" class="'+cls+'"'+(hm[n]?' title="'+esc(t.h[hm[n]])+'"':'')+'>'+(hm[n]?'<span class="hd"></span>':'')+
         (swaps[n]?'<span class="sw">⇄</span>':'')+'<span class="d">'+(n-first+1)+'</span><span>'+esc(t.names[c])+'</span>'+evOn(n).map(function(k){return '<span class="ev">'+esc(events[k].title)+'</span>';}).join('')+'</div>';
    }
    $('grid').innerHTML=h;

    // swap panel for the selected day
    var p=$('swap');
    if(sel!==null&&sel>=first&&sel<=last){
      var cw=W(sel), ow=cw==='i'?'l':'i';
      p.hidden=false;
      var eh='';evOn(sel).forEach(function(k){eh+='<div class="evitem"><span class="evtag">'+esc(events[k].title)+'</span>'+(ro?'':'<button type="button" data-ed="'+k+'">'+esc(t.evDel)+'</button>')+'</div>';});
      p.innerHTML='<div class="row"><span>'+esc(t.dayFull[dow(sel)])+' '+dm(sel)+': <span class="chip '+cw+'">'+esc(t.at[cw])+'</span></span><span class="acts">'+(ro?'':'<button type="button" id="do-swap">'+esc(swaps[sel]?t.undo:t.moveTo+' '+t.to[ow])+'</button>')+'<button type="button" id="no-swap">'+esc(t.close)+'</button></span></div>'+eh+
        (ro?'':'<form class="evadd" id="evform"><input id="evtitle" maxlength="80" placeholder="'+esc(t.evPh)+'" aria-label="'+esc(t.event)+'"><button type="submit">'+esc(t.evAdd)+'</button></form>');
      if(!ro){
        $('do-swap').onclick=function(){toggleSwap(sel);sel=null;render();};
        $('evform').onsubmit=function(e){e.preventDefault();var v=$('evtitle').value;if(v.trim()){addEvent(sel,v);render();}};
        p.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){delEvent(b.getAttribute('data-ed'));render();};});
      }
      $('no-swap').onclick=function(){sel=null;render();};
    }else{p.hidden=true;p.innerHTML='';}
    var ks=Object.keys(swaps).map(Number).filter(function(x){return x>=tn;}).sort(function(a,b){return a-b;}), sh='';
    ks.forEach(function(x){var c2=W(x);sh+='<div class="swrow"><span class="when" dir="ltr">'+dmy(x)+'</span><span class="nm">'+esc(t.dayFull[dow(x)])+' <span class="chip '+c2+'">'+esc(t.at[c2])+'</span></span>'+(ro?'':'<button type="button" data-rm="'+x+'">'+esc(t.undoShort)+'</button>')+'</div>';});
    $('swaps-title').textContent=t.swapsTitle;
    $('swaps').innerHTML=sh||'<p class="note">'+esc(t.noSwaps)+'</p>';
    $('swap-note').textContent=t.sheetNote;
    var el=Object.keys(events).filter(function(k){return events[k].n>=tn;}).sort(function(a,b){return events[a].n-events[b].n;}).slice(0,12), eh2='';
    el.forEach(function(k){var x=events[k].n;eh2+='<div class="swrow"><span class="when" dir="ltr">'+dmy(x)+'</span><span class="nm"><span class="evtag">'+esc(events[k].title)+'</span></span><span class="chip '+W(x)+'">'+esc(t.at[W(x)])+'</span></div>';});
    $('evs-title').textContent=t.evsTitle;
    $('evs').innerHTML=eh2||'<p class="note">'+esc(t.noEvs)+'</p>';
    var sy=$('sync');sy.className='syncnote'+(err&&!ro?' err':'');sy.className='syncnote'+(loadState==='fail'||loadState==='none'?' err':'');sy.innerHTML='';var st=loadState==='ok'?t.sheetOk+loadedAt:(loadState==='fail'?t.sheetFail:(loadState==='loading'?t.sheetLoading:t.sheetNone));sy.appendChild(document.createTextNode(st));if(window.KIDS_SHEET_EDIT_URL&&/^https:\/\/docs\.google\.com\//.test(window.KIDS_SHEET_EDIT_URL)){var a=document.createElement('a');a.href=window.KIDS_SHEET_EDIT_URL;a.target='_blank';a.rel='noopener';a.textContent=' '+t.editSheet;a.style.fontWeight='700';a.style.color='var(--ev)';sy.appendChild(document.createTextNode(' · '));sy.appendChild(a);}

    $('legend').innerHTML='<span><i class="dot i"></i>'+esc(t.names.i)+'</span><span><i class="dot l"></i>'+esc(t.names.l)+'</span>'+
      '<span><i class="dot p"></i>'+esc(t.past)+'</span><span><b>⇄</b>'+esc(t.swapped)+'</span><span><i class="dot e"></i>'+esc(t.event)+'</span><span><i class="dot h"></i>'+esc(t.holiday)+'</span>';

    // holiday list: merge consecutive days of the same holiday
    var runs=[], cur=null;
    for(n=first;n<=last;n++){
      var k=hm[n];
      if(k&&cur&&cur.k===k&&cur.b===n-1){cur.b=n;}
      else if(k){cur={k:k,a:n,b:n};runs.push(cur);}
    }
    h='';
    runs.forEach(function(r){
      var sq='';for(var x=r.a;x<=r.b;x++)sq+='<i class="'+W(x)+'"></i>';
      var when=r.a===r.b?dm(r.a):(dm(r.a)+' - '+dm(r.b));
      var whoTxt=r.a===r.b?'<span class="chip '+W(r.a)+'">'+esc(t.at[W(r.a)])+'</span>':'<span class="who">'+sq+'</span>';
      h+='<div class="hol'+(r.b<tn?' past':'')+'"><span class="when" dir="ltr">'+when+'</span><span class="nm">'+esc(t.h[r.k])+'</span>'+(r.b<tn?'<span class="who">'+sq+'</span>':whoTxt)+'</div>';
    });
    $('hols-title').textContent=t.holsTitle;
    $('hols').innerHTML=h||'<p class="note">'+esc(t.noHols)+'</p>';
    $('note').textContent=t.note;
  }

  function setLang(l){lang=l;try{localStorage.setItem('kids-lang',l);}catch(e){}render();}
  $('lang-he').addEventListener('click',function(){setLang('he');});
  $('lang-ru').addEventListener('click',function(){setLang('ru');});
  $('prev').addEventListener('click',function(){if(vy===MIN_Y&&vm===MIN_M)return;vm--;if(vm<0){vm=11;vy--;}render();});
  $('next').addEventListener('click',function(){vm++;if(vm>11){vm=0;vy++;}render();});
  $('today').addEventListener('click',function(){var d=new Date();vy=d.getFullYear();vm=d.getMonth();if(vy<MIN_Y||(vy===MIN_Y&&vm<MIN_M)){vy=MIN_Y;vm=MIN_M;}render();});
  function pick(e){var el=e.target.closest?e.target.closest('[data-n]'):null;if(!el)return;var n=+el.getAttribute('data-n');sel=(sel===n?null:n);render();}
  $('grid').addEventListener('click',pick);
  $('grid').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e);}});
  $('swaps').addEventListener('click',function(e){var x=e.target.getAttribute('data-rm');if(x&&!ro){toggleSwap(+x);render();}});
  render();
  function parseCSV(txt){
    var rows=[],row=[],f='',q=false,i,c;
    for(i=0;i<txt.length;i++){c=txt[i];
      if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
      else f+=c;}
    if(f!==''||row.length){row.push(f);rows.push(row);}
    return rows;
  }
  function parseDate(v){
    v=String(v||'').trim();var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m)return dn(+m[1],+m[2]-1,+m[3]);
    m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);   // day first, as in Israel
    if(m){var y=+m[3];if(y<100)y+=2000;return dn(y,+m[2]-1,+m[1]);}
    return null;
  }
  function isSwap(v){v=String(v||'').trim().toLowerCase();return v==='החלפה'||v==='swap'||v==='замена';}
  function loadSheet(){
    var url=window.KIDS_SHEET_URL;
    if(!url||!/^https:\/\/docs\.google\.com\//.test(url)){loadState='none';render();return;}
    if(loadState!=='ok'){loadState='loading';render();}
    fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(txt){
      var rows=parseCSV(txt),sw={},ev={},k=0;
      rows.forEach(function(r,idx){
        var n=parseDate(r[0]);if(n===null)return;            // skips the header row and bad dates
        var desc=String(r[2]||'').trim().slice(0,80);
        if(isSwap(r[1]))sw[n]=sw[n]?0:1;                     // the same date twice cancels out
        else if(desc){ev['r'+(k++)]={n:n,title:desc};}
      });
      for(var x in sw)if(!sw[x])delete sw[x];
      swaps=sw;events=ev;loadState='ok';
      var d=new Date();loadedAt=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
      render();
    }).catch(function(){if(loadState!=='ok')loadState='fail';render();});
  }
  loadSheet();
  setInterval(function(){if(!document.hidden)loadSheet();},5*60*1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadSheet();});
})();
</script>
</body></html>
